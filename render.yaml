services:
  - type: web
    name: luxora
    runtime: node
    rootDir: .
    buildCommand: "pnpm install --frozen-lockfile && pnpm --filter @workspace/luxora-web run build && pnpm --filter @workspace/api-server run build"
    startCommand: "NODE_ENV=production node artifacts/api-server/dist/index.mjs"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
